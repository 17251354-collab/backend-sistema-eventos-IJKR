# Alembic — Sistema de Gerenciamento de Eventos Acadêmicos (RNF10)
# Uso: alembic upgrade head | alembic revision --autogenerate -m "descricao"
# A URL vem do .env via app.core.config (env.py); o valor abaixo é fallback.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./eventos.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
